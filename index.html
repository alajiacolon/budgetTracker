<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evergreen Budget Dashboard</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
    <aside class="sidebar">
        <div class="title"></div>
        <nav aria-label="Sidebar navigation">

        </nav>
        <div class="quote"></div>
        <footer></footer>
    </aside>

    <header class="topbar">
        <nav class="breadcrumbs" aria-label="Breadcrumb"></nav>
    </header>

    <main class="dashboard-container">
        <section class="heading text"></section>

        <section class="overview-cards container-card">
            <div class="total-budget container-card "></div>
            <div class="total-spent container-card"></div>
            <div class="amt-remaining container-card"></div>
            <div class="gift-count container-card"></div>
        </section>

        <section class="progress container-card -card"></section>

        <section class="dashboard-middle">
            <div class="spending-categories container-card ivory-card"></div>
            <div class="recipient-status container-card ivory-card"></div>
        </section>
        
        <section class="dashboard-bottom">
            <div class="recent-purchases container-card ivory-card"></div>
            <div class="upcoming-dates container-card ivory-card"></div>
        </section>
        

    </main>
    <footer>

    </footer>
    <script src="js/script.js"></script>
</body>

</html>
